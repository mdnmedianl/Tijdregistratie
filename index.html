<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tijdregistratie</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='16' fill='%231e2b2a'/%3E%3Ccircle cx='16' cy='17' r='9' fill='none' stroke='%23f2c14e' stroke-width='3'/%3E%3Cpath d='M16 12v5l3 2' stroke='white' stroke-width='2.5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #f2f6f8; --card: #fff; --line: #e4eaee; --line2: #c6d2d9;
    --text: #333; --muted: #999; --soft: #666; --head: #e4eaee;
    --accent: #03a9f4; --accent-d: #0288d1; --chip: #e1f5fe; --danger: #e53935; --run: #e6f5fd;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--text); font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; background: none; border: 0; }
  input:focus, select:focus { outline: none; }
  .hidden { display: none !important; }

  /* Topbar */
  .top { height: 56px; background: #fff; border-bottom: 1px solid var(--line); display: flex; align-items: center; padding: 0 20px; gap: 16px; position: sticky; top: 0; z-index: 20; }
  .logo { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 20px; letter-spacing: -.3px; }
  .logo i { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); display: grid; place-items: center; color: #fff; }
  .logo i svg { width: 20px; height: 20px; }
  .top .sp { flex: 1; }
  .top .who { color: var(--soft); font-size: 13px; }
  .linkbtn { color: var(--accent); font-size: 13px; }

  /* Layout */
  .layout { display: flex; min-height: calc(100vh - 56px); }
  nav.side { width: 190px; background: #fff; border-right: 1px solid var(--line); padding-top: 8px; flex-shrink: 0; }
  nav.side button { display: flex; align-items: center; gap: 12px; width: 100%; padding: 14px 20px; text-transform: uppercase; font-size: 13.5px; color: var(--text); text-align: left; }
  nav.side button svg { width: 20px; height: 20px; stroke: #666; }
  nav.side button.on { background: var(--head); }
  nav.side button:hover:not(.on) { background: #f5f8fa; }
  main { flex: 1; padding: 20px; min-width: 0; max-width: 1500px; }

  /* Timer bar */
  .timerbar { background: #fff; border: 1px solid var(--line); display: flex; align-items: center; min-height: 64px; }
  .timerbar > * { flex-shrink: 0; }
  .timerbar .desc { flex: 1; min-width: 120px; border: 0; padding: 0 18px; height: 62px; font-size: 15px; background: transparent; }
  .sep { width: 1px; align-self: stretch; margin: 14px 0; border-left: 1px dotted var(--line2); }
  .projbtn { padding: 0 14px; height: 40px; display: flex; align-items: center; gap: 6px; color: var(--accent); max-width: 300px; }
  .projbtn > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .iconbtn { width: 46px; height: 40px; display: grid; place-items: center; color: #999; }
  .iconbtn svg { width: 19px; height: 19px; }
  .iconbtn.on { color: var(--accent); }
  .iconbtn:hover { color: var(--accent-d); }
  .dollar { font-size: 22px; font-weight: 400; }
  .clock { font-size: 19px; font-weight: 600; padding: 0 18px; font-variant-numeric: tabular-nums; min-width: 120px; text-align: center; }
  .manual { display: flex; align-items: center; gap: 6px; padding: 0 12px; }
  .manual input { border: 1px solid var(--line); padding: 6px 6px; border-radius: 3px; background: #fff; }
  .manual .mdur { font-weight: 600; min-width: 52px; text-align: right; font-variant-numeric: tabular-nums; }
  .start { background: var(--accent); color: #fff; height: 38px; padding: 0 26px; border-radius: 2px; font-weight: 500; letter-spacing: .4px; margin-left: 4px; }
  .start:hover { background: var(--accent-d); }
  .start.stop { background: var(--danger); }
  .modes { display: flex; flex-direction: column; gap: 2px; padding: 0 10px; }
  .modes button { color: #bbb; width: 22px; height: 22px; display: grid; place-items: center; }
  .modes button.on { color: var(--accent); }
  .modes svg { width: 15px; height: 15px; }

  /* Werkboom + tijdlijn naast elkaar */
  .workgrid { display: grid; grid-template-columns: minmax(340px, 420px) minmax(0, 1fr); gap: 20px; align-items: start; margin-top: 20px; }
  .tree { background: #fff; border: 1px solid var(--line); position: sticky; top: 76px; max-height: calc(100vh - 96px); overflow: auto; }
  .treehd { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--line); background: #fafcfd; position: sticky; top: 0; z-index: 2; }
  .treehd b { font-weight: 600; }
  .treehd label { font-size: 12.5px; color: var(--soft); display: flex; gap: 5px; align-items: center; cursor: pointer; }
  .treehd input { accent-color: var(--accent); }
  .node { --d: 0; display: flex; align-items: center; gap: 8px; padding: 0 8px 0 calc(10px + var(--d) * 20px); min-height: 42px; border-top: 1px solid #eef2f4; cursor: pointer; user-select: none; }
  .node:first-of-type { border-top: 0; }
  .node:hover { background: #f7fafb; }
  .caret { width: 16px; height: 16px; color: #aaa; transition: transform .15s; flex-shrink: 0; }
  .node.open > .caret { transform: rotate(90deg); }
  .node .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .node.client { background: #f8fafb; }
  .node.client .name { font-weight: 600; }
  .node.project .name::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--c); margin-right: 8px; vertical-align: 1px; }
  .node .tt { font-variant-numeric: tabular-nums; color: var(--soft); font-size: 13.5px; white-space: nowrap; }
  .node .today { color: var(--accent-d); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .node .acts { display: flex; gap: 0; opacity: 0; transition: opacity .1s; }
  .node:hover .acts, .node:focus-within .acts { opacity: 1; }
  .abtn { width: 28px; height: 28px; display: grid; place-items: center; color: #999; border-radius: 3px; }
  .abtn:hover { color: var(--accent-d); background: #eef4f7; }
  .abtn svg { width: 16px; height: 16px; }
  .node.task { min-height: 44px; }
  .node.task.running { background: var(--run); }
  .node.task.running .name { font-weight: 600; color: var(--accent-d); }
  .node.task.done .name { text-decoration: line-through; color: var(--muted); }
  .node.archived .name { color: var(--muted); font-style: italic; }
  .playbtn { width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid var(--accent); display: grid; place-items: center; color: var(--accent); flex-shrink: 0; background: #fff; }
  .playbtn svg { width: 13px; height: 13px; }
  .playbtn:hover { background: var(--accent); color: #fff; }
  .running .playbtn { background: var(--accent); color: #fff; }
  .running .playbtn:hover { background: var(--danger); border-color: var(--danger); }
  .node.add { cursor: text; color: var(--muted); min-height: 38px; }
  .node.add .plus { width: 16px; text-align: center; flex-shrink: 0; font-size: 17px; }
  .node.task.add .plus { width: 30px; }
  .node.add input { flex: 1; border: 0; background: transparent; padding: 8px 0; font-size: 14px; min-width: 0; }
  .node.add input::placeholder { color: #aab4ba; }
  .node.showmore { min-height: 32px; font-size: 12.5px; color: var(--muted); }
  .node.showmore:hover { color: var(--accent-d); }
  .treeempty { padding: 18px 14px 6px; color: var(--soft); font-size: 14px; }

  /* Entry list */
  .weekhead { display: flex; justify-content: space-between; align-items: baseline; margin: 0 0 8px; }
  .day + .weekhead, .weekhead.next { margin-top: 26px; }
  .weekhead .t { font-size: 15px; }
  .weekhead .tot { color: var(--muted); font-size: 13px; }
  .weekhead .tot b { color: var(--text); font-size: 17px; font-weight: 600; margin-left: 4px; font-variant-numeric: tabular-nums; }
  .day { background: #fff; border: 1px solid var(--line); margin-bottom: 14px; }
  .dayhead { background: var(--head); display: flex; justify-content: space-between; align-items: center; padding: 9px 16px; font-size: 13px; color: var(--soft); }
  .dayhead b { color: var(--text); font-size: 16px; font-weight: 600; margin-left: 4px; font-variant-numeric: tabular-nums; }
  .row { display: flex; align-items: center; border-top: 1px solid var(--line); min-height: 60px; }
  .row:first-of-type { border-top: 0; }
  .row .main { flex: 1; min-width: 0; padding: 9px 16px; cursor: pointer; display: flex; align-items: center; gap: 4px 10px; flex-wrap: wrap; }
  .row .main:hover .dtext { color: var(--accent-d); }
  .dtext { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .dtext.empty { color: var(--muted); }
  .dtext small { color: var(--soft); }
  .proj { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; font-size: 14px; }
  .proj::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .proj small { color: var(--muted); }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
  .chip { background: var(--chip); color: #444; padding: 3px 10px; font-size: 13px; border-radius: 2px; white-space: nowrap; }
  .cell { align-self: stretch; display: flex; align-items: center; border-left: 1px dotted var(--line2); margin: 12px 0; padding: 0 12px; }
  .range { color: var(--soft); font-variant-numeric: tabular-nums; white-space: nowrap; min-width: 108px; justify-content: center; font-size: 14px; }
  .dur { font-weight: 600; font-size: 17px; min-width: 66px; justify-content: center; font-variant-numeric: tabular-nums; }
  .rowbtn { width: 32px; height: 32px; display: grid; place-items: center; color: #999; border-radius: 3px; }
  .rowbtn:hover { color: var(--accent-d); background: #f2f6f8; }
  .rowbtn svg { width: 17px; height: 17px; }
  .row .cell.btns { gap: 0; padding: 0 6px; }
  .row .cell.bill { padding: 0 4px; }
  /* Cascade in de tijdlijn */
  .lhead { --d: 0; display: flex; align-items: center; gap: 8px; padding: 0 16px 0 calc(12px + var(--d) * 22px); min-height: 38px; border-top: 1px solid var(--line); cursor: pointer; user-select: none; }
  .lhead:hover { background: #f7fafb; }
  .lhead.open > .caret, .row.grp.open .caret { transform: rotate(90deg); }
  .lhead .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lhead .ltot { font-variant-numeric: tabular-nums; color: var(--soft); font-size: 14px; padding-right: 82px; }
  .lclient { background: #fafcfd; font-weight: 600; font-size: 14.5px; }
  .dayhead + .lclient { border-top: 0; }
  .lproject { font-size: 14.5px; }
  .lproject .name::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--c); margin-right: 8px; vertical-align: 1px; }
  .lproject .name { color: var(--c); }
  .row { --d: 2; }
  .row .main { padding-left: calc(12px + var(--d) * 22px); }
  .row .main .caret { margin-right: -2px; }
  .caretpad { width: 16px; flex-shrink: 0; }
  .row.grp .main { flex-wrap: nowrap; }
  .count { background: #eef2f5; color: var(--soft); border-radius: 10px; font-size: 12px; padding: 1px 8px; font-variant-numeric: tabular-nums; }
  .row.sub { background: #fbfcfd; min-height: 48px; }
  .row.sub .dtext { font-size: 14px; color: var(--soft); }
  .row.sub .dur { font-weight: 500; font-size: 15px; color: var(--soft); }
  .dtext .empty, .dtext.empty { color: var(--muted); }
  .iconbtn.half { color: #8fd3f5; }
  .more { display: block; margin: 8px auto 30px; padding: 10px 20px; border: 1px solid var(--line2); background: #fff; color: var(--soft); }
  .emptystate { text-align: center; color: var(--muted); padding: 50px 20px; background: #fff; border: 1px solid var(--line); }

  /* Popover & modal */
  .pop { position: absolute; z-index: 50; background: #fff; border: 1px solid var(--line2); box-shadow: 0 6px 22px rgba(0,0,0,.12); width: 320px; max-height: 400px; display: flex; flex-direction: column; }
  .pop input.search { border: 0; border-bottom: 1px solid var(--line); padding: 12px 14px; }
  .pop .list { overflow: auto; padding: 4px 0; }
  .pop .grp { padding: 9px 14px 3px; font-size: 11.5px; text-transform: uppercase; color: var(--muted); letter-spacing: .3px; }
  .pop .opt { display: flex; align-items: center; gap: 8px; padding: 8px 14px; width: 100%; text-align: left; }
  .pop .opt.sub { padding-left: 36px; font-size: 14px; color: var(--soft); }
  .pop .opt:hover, .pop .opt.sel { background: #f2f6f8; }
  .pop .opt .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .pop .foot { border-top: 1px solid var(--line); padding: 9px 14px; color: var(--muted); font-size: 12.5px; }
  .pop .opt input[type=checkbox] { accent-color: var(--accent); }
  .backdrop { position: fixed; inset: 0; background: rgba(30,40,50,.45); z-index: 60; display: grid; place-items: center; padding: 16px; }
  .modal { background: #fff; width: 100%; max-width: 480px; border-radius: 3px; box-shadow: 0 10px 40px rgba(0,0,0,.25); }
  .modal h3 { margin: 0; padding: 18px 22px; border-bottom: 1px solid var(--line); font-weight: 500; font-size: 18px; }
  .modal .body { padding: 18px 22px; display: grid; gap: 14px; }
  .modal .actions { padding: 14px 22px; border-top: 1px solid var(--line); display: flex; gap: 10px; justify-content: flex-end; }
  label.f { display: grid; gap: 5px; font-size: 13px; color: var(--soft); }
  label.f input, label.f select, .inp { border: 1px solid var(--line2); padding: 9px 10px; border-radius: 3px; background: #fff; font-size: 15px; color: var(--text); width: 100%; }
  label.f input:focus, label.f select:focus, .inp:focus { border-color: var(--accent); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .grid3 { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 10px; }
  .check { display: flex; gap: 8px; align-items: center; font-size: 14px; }
  .check input { accent-color: var(--accent); width: 16px; height: 16px; }
  .btn { padding: 9px 18px; border-radius: 2px; border: 1px solid var(--line2); background: #fff; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { background: var(--accent-d); }
  .btn.danger { color: var(--danger); border-color: transparent; margin-right: auto; padding-left: 0; }
  .swatches { display: flex; gap: 7px; flex-wrap: wrap; }
  .sw { width: 24px; height: 24px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px var(--line2); }
  .sw.on { box-shadow: 0 0 0 2px var(--text); }

  /* Cards: auth, reports */
  .card { background: #fff; border: 1px solid var(--line); }
  .card .hd { padding: 14px 18px; border-bottom: 1px solid var(--line); font-weight: 500; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .card .bd { padding: 18px; }
  h1.page { font-size: 22px; font-weight: 500; margin: 4px 0 18px; }
  .auth { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
  .auth .card { width: 100%; max-width: 400px; }
  .auth .bd { display: grid; gap: 14px; }
  .auth .msg { font-size: 14px; padding: 10px 12px; border-radius: 3px; background: var(--chip); }
  .auth .msg.err { background: #fdecea; color: #b71c1c; }
  .auth .logo { justify-content: center; margin: 6px 0 4px; }
  .auth p { margin: 0; color: var(--soft); font-size: 14px; }
  table.t { width: 100%; border-collapse: collapse; }
  table.t th { text-align: left; font-weight: 500; font-size: 12px; text-transform: uppercase; color: var(--muted); padding: 10px 18px; background: #fafcfd; border-bottom: 1px solid var(--line); }
  table.t td { padding: 11px 18px; border-bottom: 1px solid var(--line); }
  table.t tr:last-child td { border-bottom: 0; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 16px; }
  .stat { background: #fff; border: 1px solid var(--line); padding: 16px 18px; }
  .stat small { color: var(--muted); font-size: 12px; text-transform: uppercase; }
  .stat div { font-size: 26px; font-weight: 600; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .bars { display: grid; gap: 12px; }
  .bar .lbl { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 4px; gap: 10px; }
  .bar .track { height: 10px; background: #eef2f5; border-radius: 5px; overflow: hidden; }
  .bar .fill { height: 100%; border-radius: 5px; }
  .filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .filters .inp { width: auto; padding: 7px 10px; }
  .daybars { display: flex; align-items: flex-end; gap: 6px; height: 160px; padding-top: 10px; }
  .daybars .col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; min-width: 0; }
  .daybars .b { width: 100%; max-width: 38px; background: var(--accent); border-radius: 3px 3px 0 0; min-height: 1px; }
  .daybars .v { font-size: 11px; color: var(--soft); margin-bottom: 3px; font-variant-numeric: tabular-nums; }
  .daybars .d { font-size: 11px; color: var(--muted); margin-top: 5px; white-space: nowrap; }
  .seg { display: inline-flex; border: 1px solid var(--line2); border-radius: 3px; overflow: hidden; }
  .seg button { padding: 5px 12px; font-size: 13px; color: var(--soft); }
  .seg button.on { background: var(--accent); color: #fff; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #333; color: #fff; padding: 10px 18px; border-radius: 3px; z-index: 90; font-size: 14px; }

  /* Middelgroot scherm: boom boven de tijdlijn */
  @media (max-width: 1100px) {
    .workgrid { grid-template-columns: 1fr; }
    .tree { position: static; max-height: none; }
  }
  /* Mobiel */
  @media (max-width: 820px) {
    .layout { flex-direction: column; }
    nav.side { width: 100%; display: flex; border-right: 0; border-bottom: 1px solid var(--line); padding: 0; position: sticky; top: 56px; z-index: 15; }
    nav.side button { justify-content: center; padding: 12px 6px; font-size: 12px; gap: 6px; }
    main { padding: 12px; }
    .top .who { display: none; }
    .node .acts { opacity: 1; }
    .node .today { display: none; }
    .node { padding-left: calc(8px + var(--d) * 14px); }
    .timerbar { flex-wrap: wrap; padding-bottom: 6px; }
    .timerbar > * { order: 2; }
    .timerbar .desc { order: 0; flex: 0 0 calc(100% - 72px); min-width: 0; height: 52px; border-bottom: 1px solid var(--line); padding: 0 14px; }
    .modes { order: 1; flex: 0 0 72px; flex-direction: row; align-items: center; justify-content: center; gap: 6px; border-bottom: 1px solid var(--line); height: 52px; padding: 0; }
    .timerbar .sep { display: none; }
    .projbtn { padding: 0 6px 0 12px; margin-top: 6px; max-width: 118px; }
    .iconbtn { width: 36px; margin-top: 6px; }
    .clock { flex: 1; text-align: right; min-width: 0; padding: 0 8px; font-size: 16px; margin-top: 6px; }
    .start { padding: 0 16px; margin: 6px 8px 0 0; }
    .manual { flex-basis: 100%; padding: 8px 12px 2px; flex-wrap: wrap; }
    .manual input[type=time] { flex: 1 1 38%; min-width: 0; }
    .manual input[type=date] { flex: 1 1 70%; }
    .manual + .start { margin-left: auto; }
    .lhead { padding-left: calc(10px + var(--d) * 14px); }
    .lhead .ltot { padding-right: 0; }
    .row .main { padding-left: calc(10px + var(--d) * 14px) !important; }
    .row.grp .main, .row.sub .main { flex-wrap: wrap; }
    .row .cell.bill { margin-left: calc(var(--d) * 14px); }
    .row { flex-wrap: wrap; }
    .row .main { flex-basis: 100%; padding: 12px 14px 0; }
    .row .cell { margin: 4px 0 10px; padding: 0 8px; }
    .row .cell:nth-child(2) { border-left: 0; padding-left: 4px; }
    .tags { margin-left: 0; }
    .range { min-width: 0; }
    .dur { margin-left: auto; min-width: 0; font-size: 16px; }
    .row .cell.btns { padding: 0 4px; }
    .stats { gap: 8px; }
    .stat div { font-size: 19px; }
    .grid3 { grid-template-columns: 1fr 1fr; }
    .grid3 label:first-child { grid-column: 1 / -1; }
    table.t th, table.t td { padding: 10px; }
    .hide-m { display: none; }
  }

  /* =================== Eigen thema =================== */
  :root {
    --bg: #f5f3ee; --card: #fff; --line: #ebe7df; --line2: #d9d4c8;
    --text: #1e2b2a; --muted: #929a94; --soft: #5f6a65; --head: #efece5;
    --accent: #0f7b6c; --accent-d: #0a5f53; --chip: #e2f0ea; --danger: #c2410c; --run: #e5f2ed;

let report = { preset: 'week', from: '', to: '', group: 'project', client: '' };
let tick = null;

const clientById = id => clients.find(c => c.id === id);
const projById = id => projects.find(p => p.id === id);
const taskById = id => tasks.find(t => t.id === id);
const cur = () => running || draft;

/* Opgeslagen weergave-voorkeuren (per browser) */
const prefs = (() => { try { return JSON.parse(localStorage.getItem('tt_prefs') || '{}'); } catch { return {}; } })();
prefs.open ??= null; prefs.showDone ??= {}; prefs.archived ??= false;
const savePrefs = () => { try { localStorage.setItem('tt_prefs', JSON.stringify(prefs)); } catch {} };
const isOpen = k => prefs.open ? prefs.open.includes(k) : k.startsWith('c:');
function setOpen(k, v) {
  if (!prefs.open) prefs.open = clients.map(c => 'c:' + c.id).concat('c:none');
  prefs.open = prefs.open.filter(x => x !== k); if (v) prefs.open.push(k); savePrefs();
}

function toast(msg) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 3000);
}
function fail(error) {
  if (!error) return false;
  console.error(error);
  const m = error.message || String(error);
  toast(/relation|column|schema cache/i.test(m) ? 'De database is nog niet bijgewerkt: voer schema.sql opnieuw uit in Supabase.' : 'Fout: ' + m);
  return true;
}
// Haalt alle rijen op, ook boven de standaardlimiet van 1000 per keer
async function fetchAll(make) {
  let out = [];
  for (let from = 0; ; from += 1000) {
    const { data, error } = await make().range(from, from + 999);
    if (error) return { data: null, error };
    out = out.concat(data);
    if (data.length < 1000) return { data: out, error: null };
  }
}

/* ---------- Opstarten ---------- */
function getConfig() {
  if (CONFIG.SUPABASE_URL && CONFIG.SUPABASE_KEY) return CONFIG;
  try { return JSON.parse(localStorage.getItem('tt_config') || 'null'); } catch { return null; }
}
const logoHtml = `<div class="logo"><i><svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="13" r="7.5" stroke="#f2c14e"/><path d="M12 9.5V13l2.5 1.5M10 3h4" stroke="#fff"/></svg></i>Tijdregistratie</div>`;

async function init() {
  const cfg = getConfig();
  if (!cfg) return renderSetup();
  if (!window.supabase) { $('#app').innerHTML = '<div class="auth"><div class="card"><div class="bd">De Supabase-bibliotheek kon niet laden. Controleer je internetverbinding.</div></div></div>'; return; }
  sb = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_KEY);
  const { data } = await sb.auth.getSession();
  user = data.session?.user || null;
  sb.auth.onAuthStateChange((_ev, session) => {
    const u = session?.user || null;
    if ((u && u.id) !== (user && user.id)) { user = u; user ? startApp() : renderLogin(); }
  });
  user ? startApp() : renderLogin();
}

function renderSetup() {
  $('#app').innerHTML = `
  <div class="auth"><div class="card"><div class="bd">
    ${logoHtml}
    <p>Nog niet gekoppeld aan een database. Vul je Supabase-gegevens in.</p>
    <label class="f">Project URL<input id="cu" placeholder="https://xxxx.supabase.co"></label>
    <label class="f">Publishable key<input id="ck" placeholder="sb_publishable_..."></label>
    <button class="btn primary" id="cs">Opslaan</button>
  </div></div></div>`;
  $('#cs').onclick = () => {
    const u = $('#cu').value.trim().replace(/\/$/, ''), k = $('#ck').value.trim();
    if (!u || !k) return toast('Vul beide velden in');
    localStorage.setItem('tt_config', JSON.stringify({ SUPABASE_URL: u, SUPABASE_KEY: k }));
    init();
  };
}

function renderLogin(msg, isErr) {
  stopTick();
  $('#app').innerHTML = `
  <div class="auth"><div class="card"><form class="bd" id="lf">
    ${logoHtml}
    ${msg ? `<div class="msg ${isErr ? 'err' : ''}">${esc(msg)}</div>` : ''}
    <label class="f">E-mailadres<input id="le" type="email" autocomplete="email" required></label>
    <label class="f">Wachtwoord<input id="lp" type="password" autocomplete="current-password" minlength="6" required></label>
    <button class="btn primary" type="submit">Inloggen</button>
    <button class="linkbtn" type="button" id="ls">Nog geen account? Account aanmaken</button>
  </form></div></div>`;
  $('#lf').onsubmit = async ev => {
    ev.preventDefault();
    const { error } = await sb.auth.signInWithPassword({ email: $('#le').value.trim(), password: $('#lp').value });
    if (error) renderLogin(error.message === 'Invalid login credentials' ? 'Onjuist e-mailadres of wachtwoord.' : error.message, true);
  };
  $('#ls').onclick = async () => {
    const email = $('#le').value.trim(), password = $('#lp').value;
    if (!email || password.length < 6) return renderLogin('Vul een e-mailadres en een wachtwoord van minimaal 6 tekens in, en klik dan op "Account aanmaken".', true);
    const { data, error } = await sb.auth.signUp({ email, password });
    if (error) return renderLogin(/not allowed|disabled/i.test(error.message) ? 'Nieuwe accounts aanmaken staat uit.' : error.message, true);
    if (!data.session) renderLogin('Account aangemaakt. Bevestig je e-mailadres via de link in je mail en log daarna in.');
  };
}

async function startApp() {
  renderShell();
  await loadAll();
  render();
}

/* ---------- Data ---------- */
function rangeStart() { return addDays(startOfWeek(new Date()), -7 * (weeksShown - 1)); }

async function loadAll() {
  const [c, p, t, e, r] = await Promise.all([
    sb.from('clients').select('*').order('name'),
    sb.from('projects').select('*').order('name'),
    fetchAll(() => sb.from('tasks').select('*').order('created_at')),
    fetchAll(() => sb.from('time_entries').select('*').not('end_time', 'is', null).gte('start_time', rangeStart().toISOString()).order('start_time', { ascending: false })),
    sb.from('time_entries').select('*').is('end_time', null).maybeSingle(),
  ]);
  if (fail(c.error) || fail(p.error) || fail(t.error) || fail(e.error) || fail(r.error)) return;
  clients = c.data.sort(byName); projects = p.data.sort(byName); tasks = t.data; entries = e.data; running = r.data;
  await loadTotals();
}

async function loadTotals() {
  const [tt, pt] = await Promise.all([fetchAll(() => sb.from('task_totals').select('*')), fetchAll(() => sb.from('project_totals').select('*'))]);
  if (fail(tt.error) || fail(pt.error)) return;
  taskTot = Object.fromEntries(tt.data.map(x => [x.task_id, Number(x.ms)]));
  projTot = Object.fromEntries(pt.data.map(x => [x.project_id, Number(x.ms)]));
}
function addToTotals(e, sign = 1) {
  const d = dur(e) * sign;
  if (e.task_id) taskTot[e.task_id] = (taskTot[e.task_id] || 0) + d;
  if (e.project_id) projTot[e.project_id] = (projTot[e.project_id] || 0) + d;
}

async function setFields(obj) {
  if (running) {
    Object.assign(running, obj);
    const { error } = await sb.from('time_entries').update(obj).eq('id', running.id);
    fail(error);
  } else Object.assign(draft, obj);
}

async function startTimer(fields) {
  const descInput = $('#desc');
  if (running) await stopTimer();
  const src = fields || { ...draft, description: (descInput?.value ?? '').trim() };
  const row = { description: src.description || '', project_id: src.project_id || null, task_id: src.task_id || null, tags: src.tags || [], billable: !!src.billable, start_time: new Date().toISOString() };
  const { data, error } = await sb.from('time_entries').insert(row).select().single();
  if (fail(error)) { await loadAll(); return renderTracker(); }
  running = data; draft = emptyDraft();
  if (running.project_id) { const p = projById(running.project_id); setOpen('p:' + running.project_id, true); setOpen('c:' + (p?.client_id || 'none'), true); }
  renderTimer(); renderTree();
}

async function stopTimer() {
  if (!running) return;
  const desc = $('#desc')?.value.trim();
  const upd = { end_time: new Date().toISOString() };
  if (desc !== undefined && desc !== running.description) upd.description = desc;
  const { data, error } = await sb.from('time_entries').update(upd).eq('id', running.id).select().single();
  if (fail(error)) return;
  running = null; draft = emptyDraft();
  entries.unshift(data); sortByStart(); addToTotals(data);
  renderTimer(); renderList(); renderTree();
}

// Start of pauzeer een taak vanuit de boom
async function toggleTask(t) {
  if (running && running.task_id === t.id) return stopTimer();
  const last = entries.find(e => e.task_id === t.id);
  mode = 'timer';
  await startTimer({ description: '', project_id: t.project_id, task_id: t.id, tags: last?.tags || [], billable: last ? last.billable : false });
}

async function addManual() {
  const desc = $('#desc').value.trim();
  if (!manual.start || !manual.end) return toast('Vul een begin- en eindtijd in');
  const s = at(manual.date, manual.start); let e = at(manual.date, manual.end);
  if (e <= s) e = addDays(e, 1);
  const row = { description: desc, project_id: draft.project_id, task_id: draft.task_id, tags: draft.tags, billable: draft.billable, start_time: s.toISOString(), end_time: e.toISOString() };
  const { data, error } = await sb.from('time_entries').insert(row).select().single();
  if (fail(error)) return;
  if (new Date(data.start_time) >= rangeStart()) { entries.push(data); sortByStart(); }
  addToTotals(data);
  draft = emptyDraft(); manual.start = manual.end = '';
  renderTimer(); renderList(); renderTree();
  toast('Registratie toegevoegd');
}

/* ---------- Klanten / projecten / taken aanmaken ---------- */
async function createClient(name) {
  const { data, error } = await sb.from('clients').insert({ name }).select().single();
  if (fail(error)) return null;
  clients.push(data); clients.sort(byName); setOpen('c:' + data.id, true); return data;
}
async function createProject(name, client_id) {
  const { data, error } = await sb.from('projects').insert({ name, client_id: client_id || null, color: COLORS[projects.length % COLORS.length] }).select().single();
  if (fail(error)) return null;
  projects.push(data); projects.sort(byName); setOpen('p:' + data.id, true); return data;
}
async function createTask(name, project_id) {
  const { data, error } = await sb.from('tasks').insert({ name, project_id }).select().single();
  if (fail(error)) return null;
  tasks.push(data); return data;
}

/* ---------- Weergave: frame ---------- */
function renderShell() {
  $('#app').innerHTML = `
  <header class="top">
    ${logoHtml}
    <nav class="tabs">
      <button data-v="tracker">${I.timer}Tijd</button>
      <button data-v="reports">${I.report}Rapporten</button>
    </nav>
    <div class="sp"></div>

    <button class="linkbtn" id="logout">Uitloggen</button>
  </header>
  <div class="layout">
    <main id="main"></main>
  </div>`;

function render() {

  $$('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.v === view));

  if (view === 'tracker') renderTracker(); else renderReports();

function renderTracker() {
  $('#main').innerHTML = '<div id="tb"></div><div class="workgrid"><div class="tree" id="tree"></div><div id="list"></div></div>';
  renderTimer(); renderTree(); renderList();
}

/* ---------- Live klok ---------- */
function stopTick() { if (tick) clearInterval(tick); tick = null; }
function startTick() {
  stopTick();
  const upd = () => {
    const ms = running ? Date.now() - new Date(running.start_time) : 0;
    if ($('#clock')) $('#clock').textContent = fmtClock(ms);
    $$('[data-live]').forEach(el => el.textContent = (el.dataset.pre || '') + fmtDur(+el.dataset.live + ms));
    const t = running && (taskById(running.task_id)?.name || running.description);
    document.title = running ? fmtClock(ms) + ' · ' + (t || 'Tijdregistratie') : 'Tijdregistratie';
  };
  upd(); if (running) tick = setInterval(upd, 1000);
}
// Tijdweergave die meeloopt als de timer erbij hoort
const liveSpan = (cls, base, isLive, pre = '') => `<span class="${cls}" ${isLive ? `data-live="${base}" data-pre="${pre}"` : ''}>${pre}${fmtDur(base)}</span>`;

/* ---------- Timerbalk ---------- */
function workLabel(c) {
  const t = taskById(c.task_id), p = projById(c.project_id);
  if (!p) return null;
  return { color: p.color, text: t ? `${t.name} · ${p.name}` : p.name };
}

function renderTimer() {
  const tb = $('#tb'); if (!tb) return;
  const c = cur(); const lbl = workLabel(c);
  const descVal = running ? running.description : ($('#desc') ? $('#desc').value : c.description);
  const isManual = mode === 'manual' && !running;
  const t = taskById(c.task_id);
  tb.innerHTML = `
  <div class="timerbar">
    <input class="desc" id="desc" placeholder="${t ? 'Omschrijving (optioneel)' : 'Waar werk je aan?'}" value="${esc(descVal)}" autocomplete="off">
    <button class="projbtn" id="projBtn" ${lbl ? `style="color:${esc(lbl.color)}" title="${esc(lbl.text)}"` : ''}>${lbl ? `<span class="proj"><span>${esc(lbl.text)}</span></span>` : I.plus + '<span>Project / taak</span>'}</button>
    <div class="sep"></div>
    <button class="iconbtn ${c.tags?.length ? 'on' : ''}" id="tagBtn" title="${esc((c.tags || []).join(', ') || 'Tags')}">${I.tag}</button>
    <div class="sep"></div>
    <button class="iconbtn dollar ${c.billable ? 'on' : ''}" id="billBtn" title="Declarabel">€</button>
    <div class="sep"></div>
    ${isManual ? `
      <div class="manual">
        <input type="time" id="mS" value="${manual.start}" aria-label="Begintijd"> –
        <input type="time" id="mE" value="${manual.end}" aria-label="Eindtijd">
        <input type="date" id="mD" value="${manual.date}" aria-label="Datum">
        <span class="mdur" id="mDur"></span>
      </div>
      <button class="start" id="goBtn">${I.plus.replace('width="18" height="18" ', '')}Toevoegen</button>`
    : `<div class="clock" id="clock">00:00:00</div>
      <button class="start ${running ? 'stop' : ''}" id="goBtn">${running ? I.stopi + 'Stop' : I.play + 'Start'}</button>`}
    <div class="modes">
      <button data-m="timer" class="${!isManual ? 'on' : ''}" title="Timer">${I.clock}</button>
      <button data-m="manual" class="${isManual ? 'on' : ''}" title="Handmatig invoeren">${I.list}</button>
    </div>
  </div>`;

  const desc = $('#desc');
  desc.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); $('#goBtn').click(); } };
  desc.onchange = () => { if (running) setFields({ description: desc.value.trim() }); else draft.description = desc.value; };
  $('#projBtn').onclick = e => workPicker(e.currentTarget, cur(), async sel => { await setFields(sel); renderTimer(); renderTree(); });
  $('#tagBtn').onclick = e => tagPicker(e.currentTarget, cur().tags || [], async tags => { await setFields({ tags }); renderTimer(); });
  $('#billBtn').onclick = async () => { await setFields({ billable: !cur().billable }); renderTimer(); };
  $$('.modes button').forEach(b => b.onclick = () => { if (running) return toast('Stop eerst de lopende timer'); mode = b.dataset.m; renderTimer(); });

  if (isManual) {
    const upd = () => {
      manual.start = $('#mS').value; manual.end = $('#mE').value; manual.date = $('#mD').value || dayKey(new Date());
      if (manual.start && manual.end) { const s = at(manual.date, manual.start); let e = at(manual.date, manual.end); if (e <= s) e = addDays(e, 1); $('#mDur').textContent = fmtDur(e - s); }
      else $('#mDur').textContent = '';
    };
    ['#mS', '#mE', '#mD'].forEach(s => $(s).oninput = upd); upd();
    $('#goBtn').onclick = addManual;
  } else {
    $('#goBtn').onclick = () => running ? stopTimer() : startTimer();
  }
  startTick();
}

/* ---------- De werkboom: klant › project › taak ---------- */
function renderTree() {
  const el = $('#tree'); if (!el) return;
  const showArch = prefs.archived;
  const todayStart = startOfDay(new Date());
  const todayByTask = {};
  entries.forEach(e => { if (e.task_id && new Date(e.start_time) >= todayStart) todayByTask[e.task_id] = (todayByTask[e.task_id] || 0) + dur(e); });
  const runP = running?.project_id, runT = running?.task_id;
  const runC = runP ? (projById(runP)?.client_id || 'none') : null;

  const taskHtml = (t, p) => {
    const isRun = runT === t.id;
    const today = todayByTask[t.id] || 0;
    return `<div class="node task tint ${isRun ? 'running' : ''} ${t.done ? 'done' : ''}" style="--d:2;--c:${esc(p.color)}" data-act="play" data-id="${t.id}" title="${isRun ? 'Klik om te pauzeren' : 'Klik om tijd bij te houden'}">
      <button class="playbtn" tabindex="-1" aria-label="${isRun ? 'Pauzeren' : 'Starten'}">${isRun ? I.pause : I.play}</button>
      <span class="name">${esc(t.name)}</span>
      ${(today || isRun) ? liveSpan('today', today, isRun, 'vandaag ') : ''}
      ${liveSpan('tt', taskTot[t.id] || 0, isRun)}
      <span class="acts">
        <button class="abtn" data-act="done" data-id="${t.id}" title="${t.done ? 'Weer actief maken' : 'Afronden'}">${t.done ? I.undo : I.check}</button>
        <button class="abtn" data-act="edit-t" data-id="${t.id}" title="Bewerken">${I.edit}</button>
      </span>
    </div>`;
  };

  const projectHtml = p => {
    const k = 'p:' + p.id, open = isOpen(k);
    const all = tasks.filter(t => t.project_id === p.id);
    const active = all.filter(t => !t.done), done = all.filter(t => t.done);
    const showDone = !!prefs.showDone[p.id];
    let h = `<div class="node project ${open ? 'open' : ''} ${p.archived ? 'archived' : ''}" style="--d:1;--c:${esc(p.color)}" data-act="toggle" data-k="${k}">
      ${I.caret}<span class="name">${esc(p.name)}</span>
      ${!open && active.length ? `<span class="today" style="color:var(--muted)">${active.length} ${active.length === 1 ? 'taak' : 'taken'}</span>` : ''}
      ${liveSpan('tt', projTot[p.id] || 0, runP === p.id)}
      <span class="acts"><button class="abtn" data-act="edit-p" data-id="${p.id}" title="Project bewerken">${I.edit}</button></span>
    </div>`;
    if (open) {
      h += active.map(t => taskHtml(t, p)).join('');
      if (done.length) {
        if (showDone) h += done.map(t => taskHtml(t, p)).join('');
        h += `<div class="node showmore tint" style="--d:2;--c:${esc(p.color)}" data-act="showdone" data-id="${p.id}"><span style="width:30px"></span>${showDone ? 'Afgeronde taken verbergen' : `${done.length} afgeronde ${done.length === 1 ? 'taak' : 'taken'} tonen`}</div>`;
      }
      h += `<div class="node add task tint" style="--d:2;--c:${esc(p.color)}"><span class="plus">+</span><input data-add="task" data-parent="${p.id}" placeholder="Taak toevoegen…" enterkeyhint="done"></div>`;
    }
    return h;
  };

  const clientHtml = (c, plist) => {
    const id = c ? c.id : 'none', k = 'c:' + id, open = isOpen(k);
    const total = plist.reduce((a, p) => a + (projTot[p.id] || 0), 0);
    let h = `<div class="node client ${open ? 'open' : ''} ${c?.archived ? 'archived' : ''}" style="--d:0" data-act="toggle" data-k="${k}">
      ${I.caret}${c ? `<span data-act="edit-c" data-id="${c.id}" title="Logo en naam wijzigen">${logoBadge(c)}</span>` : ''}<span class="name">${c ? esc(c.name) : '<span style="color:var(--soft);font-weight:500">Zonder klant</span>'}</span>
      ${liveSpan('tt', total, runC === id)}
      <span class="acts">${c ? `<button class="abtn" data-act="edit-c" data-id="${c.id}" title="Klant bewerken">${I.edit}</button>` : ''}</span>
    </div>`;
    if (open) {
      h += plist.map(projectHtml).join('');
      h += `<div class="node add" style="--d:1"><span class="plus">+</span><input data-add="project" data-parent="${c ? c.id : ''}" placeholder="Project toevoegen…" enterkeyhint="done"></div>`;
    }
    return h;
  };

  const visP = projects.filter(p => showArch || !p.archived);
  const visC = clients.filter(c => showArch || !c.archived);
  let html = `<div class="treehd"><b>Klanten &amp; projecten</b><label><input type="checkbox" id="showArch" ${showArch ? 'checked' : ''}> Gearchiveerd tonen</label></div>`;
  if (!clients.length && !projects.length) html += `<div class="treeempty">Begin met het toevoegen van een klant. Daarna kun je per klant projecten en per project taken toevoegen.</div>`;
  html += visC.map(c => clientHtml(c, visP.filter(p => p.client_id === c.id))).join('');
  const orphan = visP.filter(p => !p.client_id || !clientById(p.client_id));
  if (orphan.length) html += clientHtml(null, orphan);
  html += `<div class="node add" style="--d:0"><span class="plus">+</span><input data-add="client" placeholder="Klant toevoegen…" enterkeyhint="done"></div>`;
  el.innerHTML = html;

  $('#showArch').onchange = ev => { prefs.archived = ev.target.checked; savePrefs(); renderTree(); };
  startTick();
}

// Klikken en typen in de boom (één keer gekoppeld via event delegation)
document.addEventListener('click', async ev => {
  const tree = ev.target.closest('#tree'); if (!tree) return;
  const t = ev.target.closest('[data-act]'); if (!t) return;
  const act = t.dataset.act, id = t.dataset.id;
  if (act === 'toggle') { setOpen(t.dataset.k, !isOpen(t.dataset.k)); renderTree(); }
  else if (act === 'play') { const task = taskById(id); if (task) await toggleTask(task); }
  else if (act === 'done') {
    const task = taskById(id); const done = !task.done;
    if (done && running?.task_id === id) await stopTimer();
    const { error } = await sb.from('tasks').update({ done }).eq('id', id);
    if (!fail(error)) { task.done = done; renderTree(); if (done) toast(`"${task.name}" afgerond`); }
  }
  else if (act === 'showdone') { prefs.showDone[id] = !prefs.showDone[id]; savePrefs(); renderTree(); }
  else if (act === 'edit-c') editNode('client', clientById(id));
  else if (act === 'edit-p') editNode('project', projById(id));
  else if (act === 'edit-t') editNode('task', taskById(id));
});
document.addEventListener('keydown', async ev => {
  const inp = ev.target.closest?.('#tree input[data-add]'); if (!inp) return;
  if (ev.key === 'Escape') { inp.value = ''; inp.blur(); return; }
  if (ev.key !== 'Enter') return;
  ev.preventDefault();
  const name = inp.value.trim(); if (!name) return;
  const kind = inp.dataset.add, parent = inp.dataset.parent;
  inp.disabled = true;
  const ok = kind === 'client' ? await createClient(name) : kind === 'project' ? await createProject(name, parent) : await createTask(name, parent);
  renderTree();
  // Focus terug in hetzelfde invoerveld, zodat je snel meerdere kunt toevoegen
  const sel = `#tree input[data-add="${kind}"]` + (parent !== undefined ? `[data-parent="${parent}"]` : '');
  const again = $(sel); if (again) { if (!ok) again.value = name; again.focus(); }
});

/* ---------- Bewerkvenster voor klant / project / taak ---------- */
function openModal(html) {
  const bd = document.createElement('div'); bd.className = 'backdrop'; bd.innerHTML = html;
  document.body.appendChild(bd);
  const close = () => bd.remove();
  bd.addEventListener('mousedown', ev => { if (ev.target === bd) close(); });
  bd.addEventListener('keydown', ev => { if (ev.key === 'Escape') close(); });
  return [bd, close];
}

function clientOptions(sel) { return `<option value="">— Zonder klant —</option>` + clients.map(c => `<option value="${c.id}" ${c.id === sel ? 'selected' : ''}>${esc(c.name)}${c.archived ? ' (gearchiveerd)' : ''}</option>`).join(''); }
function projectOptions(sel, withNone = true) {
  const groups = [...clients, null].map(c => {
    const ps = projects.filter(p => c ? p.client_id === c.id : !p.client_id || !clientById(p.client_id));
    if (!ps.length) return '';
    return `<optgroup label="${esc(c ? c.name : 'Zonder klant')}">${ps.map(p => `<option value="${p.id}" ${p.id === sel ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}</optgroup>`;
  }).join('');
  return (withNone ? '<option value="">— Geen project —</option>' : '') + groups;
}

          <div class="tintprev" id="nPrev" style="--c:${esc(color)}"><div class="pp">${esc(obj.name)}</div><div class="pt">Taak</div><div class="pt">Taak</div></div></div>` : ''}

/* ---------- Tijdlijn per week / dag ---------- */
function entryTitle(e) {
  const t = taskById(e.task_id);
  if (t && e.description) return `${esc(t.name)} <small>— ${esc(e.description)}</small>`;
  if (t) return esc(t.name);
  return esc(e.description || '(geen omschrijving)');
}

// Open/dicht-status van groepen in de tijdlijn (alleen voor deze sessie)
const listClosed = new Set();   // klant- en projectkoppen die zijn dichtgeklapt
const listOpen = new Set();     // taakgroepen die zijn opengeklapt
let listGroups = new Map();

// Groepeer de registraties van één dag als klant › project › taak
function cascade(list, dk) {
  const cMap = new Map();
  for (const e of list) {
    const p = projById(e.project_id), c = p && clientById(p.client_id);
    const ck = c ? c.id : '-', pk = p ? p.id : '-';
    const gk = e.task_id && taskById(e.task_id) ? 't:' + e.task_id : 'd:' + (e.description || '').trim().toLowerCase();
    if (!cMap.has(ck)) cMap.set(ck, { c, projects: new Map() });
    const cg = cMap.get(ck);
    if (!cg.projects.has(pk)) cg.projects.set(pk, { p, groups: new Map() });
    const pg = cg.projects.get(pk);
    const key = `${dk}|${pk}|${gk}`;
    if (!pg.groups.has(key)) pg.groups.set(key, { key, list: [] });
    pg.groups.get(key).list.push(e);
  }
  // Sorteer: grootste tijd bovenaan; klanten met naam vóór "zonder klant"
  const tot = arr => arr.reduce((a, x) => a + x, 0);
  return [...cMap.values()].map(cg => {
    const projects = [...cg.projects.values()].map(pg => {
      const groups = [...pg.groups.values()].map(g => ({ ...g, ms: sum(g.list) })).sort((a, b) => b.ms - a.ms);
      return { ...pg, groups, ms: tot(groups.map(g => g.ms)) };
    }).sort((a, b) => (!a.p) - (!b.p) || b.ms - a.ms);
    return { ...cg, projects, ms: tot(projects.map(p => p.ms)) };
  }).sort((a, b) => (!a.c) - (!b.c) || b.ms - a.ms);
}

function renderList() {
  const el = $('#list'); if (!el) return;
  if (!entries.length) { el.innerHTML = `<div class="emptystate">Nog geen registraties deze week. Klik op ▶ bij een taak links, of typ hierboven waar je aan werkt en klik op START.</div><button class="more" id="more">Eerdere weken laden</button>`; $('#more').onclick = loadMore; return; }
  const today = startOfDay(new Date()), thisWeek = startOfWeek(today);
  const weeks = new Map();
  for (const e of entries) {
    const d = new Date(e.start_time); const wk = dayKey(startOfWeek(d)); const dk = dayKey(d);
    if (!weeks.has(wk)) weeks.set(wk, { start: startOfWeek(d), days: new Map() });
    const w = weeks.get(wk);
    if (!w.days.has(dk)) w.days.set(dk, { date: startOfDay(d), list: [] });
    w.days.get(dk).list.push(e);
  }
  listGroups = new Map();
  let html = '';
  for (const w of weeks.values()) {
    const all = [...w.days.values()].flatMap(d => d.list);
    const diff = Math.round((thisWeek - w.start) / 864e5 / 7);
    const end = addDays(w.start, 6);
    const label = diff === 0 ? 'Deze week' : diff === 1 ? 'Vorige week' : `${w.start.getDate()} ${MONTHS[w.start.getMonth()]} – ${end.getDate()} ${MONTHS[end.getMonth()]}`;
    html += `<div class="weekhead ${html ? 'next' : ''}"><span class="t">${label}</span><span class="tot">Weektotaal: <b>${fmtDur(sum(all))}</b></span></div>`;
    for (const d of w.days.values()) {
      const dk = dayKey(d.date);
      const dd = Math.round((today - d.date) / 864e5);
      const dl = dd === 0 ? 'Vandaag' : dd === 1 ? 'Gisteren' : fmtDate(d.date);
      html += `<div class="day"><div class="dayhead"><span>${dl}</span><span>Totaal: <b>${fmtDur(sum(d.list))}</b></span></div>`;
      for (const cg of cascade(d.list, dk)) {
        const ck = `${dk}|c|${cg.c ? cg.c.id : '-'}`, cOpen = !listClosed.has(ck);
        html += `<div class="lhead lclient ${cOpen ? 'open' : ''}" data-act="xh" data-k="${esc(ck)}" style="--d:0">${I.caret}${cg.c ? logoBadge(cg.c) : ''}<span class="name">${cg.c ? esc(cg.c.name) : 'Zonder klant'}</span><span class="ltot">${fmtDur(cg.ms)}</span></div>`;
        if (!cOpen) continue;
        for (const pg of cg.projects) {
          const pk = `${dk}|p|${pg.p ? pg.p.id : '-'}|${cg.c ? cg.c.id : '-'}`, pOpen = !listClosed.has(pk);
          html += `<div class="lhead lproject ${pOpen ? 'open' : ''}" data-act="xh" data-k="${esc(pk)}" style="--d:1;--c:${pg.p ? esc(pg.p.color) : '#bbb'}">${I.caret}<span class="name">${pg.p ? esc(pg.p.name) : 'Geen project'}</span><span class="ltot">${fmtDur(pg.ms)}</span></div>`;
          if (!pOpen) continue;
          for (const g of pg.groups) {
            if (g.list.length === 1) { html += rowHtml(g.list[0], 2); continue; }
            listGroups.set(g.key, g);
            html += groupHtml(g);
            if (listOpen.has(g.key)) html += [...g.list].sort((a, b) => new Date(a.start_time) - new Date(b.start_time)).map(e => rowHtml(e, 3, true)).join('');
          }
        }
      }
      html += '</div>';
    }
  }
  html += '<button class="more" id="more">Eerdere weken laden</button>';
  el.innerHTML = html;
  $('#more').onclick = loadMore;
  el.onclick = async ev => {
    const t = ev.target.closest('[data-act]'); if (!t) return;
    const act = t.dataset.act;
    if (act === 'xh') { const k = t.dataset.k; listClosed.has(k) ? listClosed.delete(k) : listClosed.add(k); return renderList(); }
    if (act === 'xg' || act === 'gplay' || act === 'gbill') {
      const g = listGroups.get(t.closest('[data-g]').dataset.g); if (!g) return;
      if (act === 'xg') { listOpen.has(g.key) ? listOpen.delete(g.key) : listOpen.add(g.key); return renderList(); }
      const last = g.list[0]; // nieuwste eerst
      if (act === 'gplay') { mode = 'timer'; return startTimer({ description: last.description, project_id: last.project_id, task_id: last.task_id, tags: last.tags, billable: last.billable }); }
      const val = !g.list.every(e => e.billable);
      const { error } = await sb.from('time_entries').update({ billable: val }).in('id', g.list.map(e => e.id));
      if (!fail(error)) { g.list.forEach(e => e.billable = val); renderList(); }
      return;
    }
    const e = entries.find(x => x.id === t.closest('.row')?.dataset.id); if (!e) return;
    if (act === 'edit') editEntry(e);
    else if (act === 'play') { mode = 'timer'; await startTimer({ description: e.description, project_id: e.project_id, task_id: e.task_id, tags: e.tags, billable: e.billable }); }
    else if (act === 'bill') {
      e.billable = !e.billable;
      const { error } = await sb.from('time_entries').update({ billable: e.billable }).eq('id', e.id);
      if (!fail(error)) renderList();
    } else if (act === 'del') deleteEntry(e);
  };
}

// Eén regel per taak met meerdere registraties op een dag
function groupHtml(g) {
  const sorted = [...g.list].sort((a, b) => new Date(a.start_time) - new Date(b.start_time));
  const first = new Date(sorted[0].start_time), last = new Date(sorted[sorted.length - 1].end_time);
  const t = taskById(g.list[0].task_id);
  const title = t ? esc(t.name) : esc(g.list[0].description || '(geen omschrijving)');
  const allBill = g.list.every(e => e.billable), someBill = g.list.some(e => e.billable);
  const open = listOpen.has(g.key);
  const pc = projById(g.list[0].project_id)?.color;
  return `<div class="row grp ${pc ? 'tint' : ''} ${open ? 'open' : ''}" data-g="${esc(g.key)}" style="--d:2${pc ? `;--c:${esc(pc)}` : ''}">
    <div class="main" data-act="xg" title="${open ? 'Inklappen' : 'Losse registraties tonen'}">
      ${I.caret}<span class="dtext ${t || g.list[0].description ? '' : 'empty'}">${title}</span><span class="count">${g.list.length}</span>
    </div>
    <div class="cell bill"><button class="iconbtn dollar ${allBill ? 'on' : someBill ? 'half' : ''}" data-act="gbill" title="Declarabel (alle ${g.list.length})">€</button></div>
    <div class="cell range">${fmtTime(first)} – ${fmtTime(last)}</div>
    <div class="cell dur">${fmtDur(g.ms)}</div>
    <div class="cell btns">
      <button class="rowbtn" data-act="gplay" title="Doorgaan met deze taak">${I.playo}</button>
      <span class="rowbtn" aria-hidden="true"></span>
    </div>
  </div>`;
}

// Eén registratie. In een opengeklapte groep (sub) staat de taaknaam al in de groepsregel.
function rowHtml(e, depth = 2, sub = false) {
  const s = new Date(e.start_time), en = new Date(e.end_time);
  const t = taskById(e.task_id);
  let title;
  if (sub) title = e.description ? esc(e.description) : `<span class="empty">geen omschrijving</span>`;
  else title = entryTitle(e);
  const empty = !sub && !e.description && !t;
  const pc = projById(e.project_id)?.color;
  return `<div class="row ${sub ? 'sub' : ''} ${pc ? 'tint' : ''}" data-id="${e.id}" style="--d:${depth}${pc ? `;--c:${esc(pc)}` : ''}">
    <div class="main" data-act="edit">
      ${sub ? '' : '<span class="caretpad"></span>'}<span class="dtext ${empty ? 'empty' : ''}">${title}</span>
      ${e.tags?.length ? `<span class="tags">${e.tags.map(x => `<span class="chip">${esc(x)}</span>`).join('')}</span>` : ''}
    </div>
    <div class="cell bill"><button class="iconbtn dollar ${e.billable ? 'on' : ''}" data-act="bill" title="Declarabel">€</button></div>
    <div class="cell range">${fmtTime(s)} – ${fmtTime(en)}</div>
    <div class="cell dur">${fmtDur(en - s)}</div>
    <div class="cell btns">
      <button class="rowbtn" data-act="play" title="Doorgaan met deze taak">${I.playo}</button>
      <button class="rowbtn" data-act="del" title="Verwijderen">${I.trash}</button>
    </div>
  </div>`;
}

async function loadMore() { weeksShown += 4; await loadAll(); renderList(); renderTree(); }

async function deleteEntry(e) {
  if (!confirm('Deze registratie verwijderen?')) return false;
  const { error } = await sb.from('time_entries').delete().eq('id', e.id);
  if (fail(error)) return false;
  entries = entries.filter(x => x.id !== e.id); addToTotals(e, -1);
  renderList(); renderTree(); return true;
}

/* ---------- Registratie bewerken ---------- */
function taskOptions(projectId, sel) {
  const ts = tasks.filter(t => t.project_id === projectId && (!t.done || t.id === sel));
  return '<option value="">— Geen taak —</option>' + ts.map(t => `<option value="${t.id}" ${t.id === sel ? 'selected' : ''}>${esc(t.name)}${t.done ? ' (afgerond)' : ''}</option>`).join('');
}

function editEntry(e) {

  const [bd, close] = openModal(`<form class="modal">

      </div>

      <div class="grid3">

/* ---------- Popovers ---------- */
let popEl = null;
function closePop() { if (popEl) { popEl.remove(); popEl = null; document.removeEventListener('mousedown', outside, true); } }
function outside(ev) { if (popEl && !popEl.contains(ev.target)) closePop(); }
function openPop(anchor, html) {
  closePop();
  popEl = document.createElement('div'); popEl.className = 'pop'; popEl.innerHTML = html;
  document.body.appendChild(popEl);
  const r = anchor.getBoundingClientRect();
  const left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - popEl.offsetWidth - 8));
  popEl.style.left = left + 'px'; popEl.style.top = (r.bottom + window.scrollY + 4) + 'px';
  setTimeout(() => document.addEventListener('mousedown', outside, true));
  return popEl;
}

// Kies een project of taak voor de timerbalk
function workPicker(anchor, c, onPick) {
  const pop = openPop(anchor, `<input class="search" placeholder="Zoek project of taak…"><div class="list"></div><div class="foot">Nieuwe klanten, projecten en taken voeg je toe in het overzicht links.</div>`);
  const inp = $('.search', pop), list = $('.list', pop);
  const draw = () => {
    const q = inp.value.trim().toLowerCase();
    const m = s => !q || s.toLowerCase().includes(q);
    let h = q ? '' : `<button class="opt ${!c.project_id ? 'sel' : ''}" data-p=""><span class="dot" style="background:#ccc"></span>Geen project</button>`;
    for (const cl of [...clients.filter(x => !x.archived), null]) {
      const ps = projects.filter(p => !p.archived && (cl ? p.client_id === cl.id : !p.client_id || !clientById(p.client_id)));
      let gh = '';
      for (const p of ps) {
        const ts = tasks.filter(t => t.project_id === p.id && !t.done);
        const pm = m(p.name) || (cl && m(cl.name));
        const tm = ts.filter(t => pm || m(t.name));
        if (!pm && !tm.length) continue;
        gh += `<button class="opt ${p.id === c.project_id && !c.task_id ? 'sel' : ''}" data-p="${p.id}"><span class="dot" style="background:${esc(p.color)}"></span>${esc(p.name)}</button>`;
        gh += tm.map(t => `<button class="opt sub ${t.id === c.task_id ? 'sel' : ''}" data-p="${p.id}" data-t="${t.id}">${esc(t.name)}</button>`).join('');
      }
      if (gh) h += `<div class="grp">${cl ? logoBadge(cl, 'sm') : ''}${esc(cl ? cl.name : 'Zonder klant')}</div>` + gh;
    }
    list.innerHTML = h || '<div class="opt" style="color:#999">Niets gevonden</div>';
  };
  draw(); inp.focus(); inp.oninput = draw;
  list.onclick = ev => { const b = ev.target.closest('[data-p]'); if (!b) return; closePop(); onPick({ project_id: b.dataset.p || null, task_id: b.dataset.t || null }); };
  inp.onkeydown = ev => { if (ev.key === 'Enter') { ev.preventDefault(); $('[data-p]:not([data-p=""])', list)?.click(); } if (ev.key === 'Escape') closePop(); };
}

function knownTags() { return [...new Set(entries.flatMap(e => e.tags || []).concat(cur().tags || []))].sort((a, b) => a.localeCompare(b)); }

function tagPicker(anchor, selected, onChange) {
  let sel = [...selected];
  const pop = openPop(anchor, `<input class="search" placeholder="Zoek of voeg een tag toe…"><div class="list"></div>`);
  const inp = $('.search', pop), list = $('.list', pop);
  const draw = () => {
    const q = inp.value.trim().toLowerCase();
    const all = [...new Set(knownTags().concat(sel))].filter(t => !q || t.toLowerCase().includes(q));
    list.innerHTML = all.map(t => `<label class="opt"><input type="checkbox" value="${esc(t)}" ${sel.includes(t) ? 'checked' : ''}>${esc(t)}</label>`).join('') +
      (q && !all.some(t => t.toLowerCase() === q) ? `<button class="opt" data-new style="color:var(--accent)">+ Tag "${esc(inp.value.trim())}" toevoegen</button>` : '') +
      (!all.length && !q ? '<div class="opt" style="color:#999">Typ om een tag toe te voegen</div>' : '');
  };
  draw(); inp.focus(); inp.oninput = draw;
  const add = () => { const t = inp.value.trim(); if (t && !sel.includes(t)) { sel.push(t); onChange([...sel]); } inp.value = ''; draw(); };
  list.onchange = ev => { const v = ev.target.value; sel = ev.target.checked ? [...sel, v] : sel.filter(x => x !== v); onChange([...sel]); };
  list.onclick = ev => { if (ev.target.closest('[data-new]')) add(); };
  inp.onkeydown = ev => { if (ev.key === 'Enter') { ev.preventDefault(); add(); } if (ev.key === 'Escape') closePop(); };
}

/* ---------- Rapporten ---------- */
function reportRange() {
  const now = new Date(), wk = startOfWeek(now);
  switch (report.preset) {
    case 'week': return [wk, addDays(wk, 7)];
    case 'lastweek': return [addDays(wk, -7), wk];
    case 'month': return [new Date(now.getFullYear(), now.getMonth(), 1), new Date(now.getFullYear(), now.getMonth() + 1, 1)];
    case 'lastmonth': return [new Date(now.getFullYear(), now.getMonth() - 1, 1), new Date(now.getFullYear(), now.getMonth(), 1)];
    case 'year': return [new Date(now.getFullYear(), 0, 1), new Date(now.getFullYear() + 1, 0, 1)];
    default: return [report.from ? at(report.from, '00:00') : wk, report.to ? addDays(at(report.to, '00:00'), 1) : addDays(wk, 7)];
  }
}

async function renderReports() {
  const [from, to] = reportRange();
  $('#main').innerHTML = `
    <h1 class="page">Rapporten</h1>
    <div class="filters" style="margin-bottom:16px">
      <select class="inp" id="rp">
        ${[['week', 'Deze week'], ['lastweek', 'Vorige week'], ['month', 'Deze maand'], ['lastmonth', 'Vorige maand'], ['year', 'Dit jaar'], ['custom', 'Aangepast']].map(([v, l]) => `<option value="${v}" ${report.preset === v ? 'selected' : ''}>${l}</option>`).join('')}
      </select>
      <span class="${report.preset === 'custom' ? '' : 'hidden'}" style="display:flex;gap:6px;align-items:center">
        <input type="date" class="inp" id="rf" value="${dayKey(from)}"> t/m <input type="date" class="inp" id="rt" value="${dayKey(addDays(to, -1))}">
      </span>
      <select class="inp" id="rcl"><option value="">Alle klanten</option>${clients.map(c => `<option value="${c.id}" ${report.client === c.id ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select>
      <span style="flex:1"></span>
      <button class="btn" id="csv">Exporteren (CSV)</button>
    </div>
    <div id="rout"><div class="emptystate">Laden…</div></div>`;
  $('#rp').onchange = ev => { report.preset = ev.target.value; renderReports(); };
  $('#rf').onchange = ev => { report.from = ev.target.value; renderReports(); };
  $('#rt').onchange = ev => { report.to = ev.target.value; renderReports(); };
  $('#rcl').onchange = ev => { report.client = ev.target.value; renderReports(); };
  if (report.preset === 'custom' && !report.from) { report.from = dayKey(from); report.to = dayKey(addDays(to, -1)); }

  const { data, error } = await fetchAll(() => sb.from('time_entries').select('*').not('end_time', 'is', null).gte('start_time', from.toISOString()).lt('start_time', to.toISOString()).order('start_time'));
  if (fail(error)) return;
  const list = (data || []).filter(e => !report.client || projById(e.project_id)?.client_id === report.client);
  $('#csv').onclick = () => exportCsv(list, from, to);

  const total = sum(list), billable = sum(list.filter(e => e.billable));

  // Per dag: gestapelde staven in de projectkleuren
  const days = []; const span = Math.round((to - from) / 864e5);
  if (span <= 31) for (let d = new Date(from); d < to; d = addDays(d, 1)) days.push(d);
  const byDay = {};
  list.forEach(e => {
    const k = dayKey(new Date(e.start_time)), pk = e.project_id || '';
    byDay[k] ??= { ms: 0, p: {} }; byDay[k].ms += dur(e); byDay[k].p[pk] = (byDay[k].p[pk] || 0) + dur(e);
  });
  const dmax = Math.max(1, ...days.map(d => byDay[dayKey(d)]?.ms || 0));
  const stack = d => {
    const v = byDay[dayKey(d)]; if (!v) return '<div class="b empty"></div>';
    return Object.entries(v.p).sort((x, y) => y[1] - x[1]).map(([pid, ms]) => { const p = projById(pid);
      return `<div class="b" title="${esc(p ? p.name : 'Geen project')}: ${fmtDur(ms)}" style="height:${(ms / dmax * 100).toFixed(2)}%;background:${p ? esc(p.color) : '#c9c4b8'}"></div>`; }).join('');
  };

  // Cascade: klant › project › taak › losse registraties
  const tree = cascade(list, 'r');
  const pct = ms => total ? ms / total * 100 : 0;
  const billOf = arr => sum(arr.filter(e => e.billable));
  const cols = (ms, bill, c) => `<span class="rc bill">${bill ? fmtDur(bill) : '<span style="opacity:.4">–</span>'}</span><span class="rc dur">${fmtDur(ms)}</span><span class="rc share"><span class="sbar"><span style="width:${pct(ms).toFixed(1)}%;${c ? `background:${esc(c)}` : ''}"></span></span><small>${Math.round(pct(ms))}%</small></span>`;
  let rt = '';
  for (const cg of tree) {
    const all = cg.projects.flatMap(pg => pg.groups.flatMap(g => g.list));
    const ck = 'r|c|' + (cg.c ? cg.c.id : '-'), cOpen = !listClosed.has(ck);
    rt += `<div class="rrow rclient ${cOpen ? 'open' : ''}" data-x="${esc(ck)}" style="--d:0"><span class="rn">${I.caret}${cg.c ? logoBadge(cg.c) : ''}<span class="name">${cg.c ? esc(cg.c.name) : 'Zonder klant'}</span></span>${cols(cg.ms, billOf(all), '#57534e')}</div>`;
    if (!cOpen) continue;
    for (const pg of cg.projects) {
      const pl = pg.groups.flatMap(g => g.list), col = pg.p ? pg.p.color : '#a8a29e';
      const pk = 'r|p|' + (pg.p ? pg.p.id : '-') + '|' + (cg.c ? cg.c.id : '-'), pOpen = !listClosed.has(pk);
      rt += `<div class="rrow rproject ${pOpen ? 'open' : ''}" data-x="${esc(pk)}" style="--d:1;--c:${esc(col)}"><span class="rn">${I.caret}<span class="name">${pg.p ? esc(pg.p.name) : 'Geen project'}</span></span>${cols(pg.ms, billOf(pl), col)}</div>`;
      if (!pOpen) continue;
      for (const g of pg.groups) {
        const t = taskById(g.list[0].task_id), gOpen = listOpen.has('r|' + g.key);
        const title = t ? esc(t.name) : (g.list[0].description ? esc(g.list[0].description) : '<span style="opacity:.6">(geen omschrijving)</span>');
        rt += `<div class="rrow rtask tint ${gOpen ? 'open' : ''}" data-o="${esc('r|' + g.key)}" style="--d:2;--c:${esc(col)}"><span class="rn">${I.caret}<span class="name">${title}</span>${g.list.length > 1 ? `<span class="count">${g.list.length}</span>` : ''}</span>${cols(g.ms, billOf(g.list), col)}</div>`;
        if (gOpen) rt += [...g.list].sort((x, y) => new Date(x.start_time) - new Date(y.start_time)).map(e => {
          const st = new Date(e.start_time), en = new Date(e.end_time);
          return `<div class="rrow rentry tint" style="--d:3;--c:${esc(col)}"><span class="rn"><span class="rdate">${fmtDate(st)}</span><span class="rtime">${fmtTime(st)} – ${fmtTime(en)}</span><span class="name">${t && e.description ? esc(e.description) : ''}</span>${e.tags?.length ? e.tags.map(x => `<span class="chip">${esc(x)}</span>`).join('') : ''}</span><span class="rc bill">${e.billable ? '€' : ''}</span><span class="rc dur">${fmtDur(dur(e))}</span><span class="rc share"></span></div>`;
        }).join('');
      }
    }
  }

  $('#rout').innerHTML = `
    <div class="stats">
      <div class="stat"><small>Totaal</small><div>${fmtDur(total)}</div></div>
      <div class="stat"><small>Declarabel</small><div>${fmtDur(billable)}</div></div>
      <div class="stat"><small>Registraties</small><div>${list.length}</div></div>
    </div>
    ${days.length ? `<div class="card" style="margin-bottom:16px"><div class="hd">Per dag</div><div class="bd"><div class="daybars">
      ${days.map(d => { const v = byDay[dayKey(d)]?.ms || 0; return `<div class="col" title="${fmtDate(d)}: ${fmtDur(v)}"><span class="v">${v ? fmtDur(v) : ''}</span><div class="stack" style="height:${(v / dmax * 100).toFixed(1)}%">${stack(d)}</div><span class="d">${days.length > 10 ? d.getDate() : DAYS[d.getDay()] + ' ' + d.getDate()}</span></div>`; }).join('')}
    </div></div></div>` : ''}
    <div class="card"><div class="hd"><span>Overzicht</span><span class="rexp"><button class="linkbtn" id="rOpen">Alles openklappen</button> · <button class="linkbtn" id="rClose">Alles inklappen</button></span></div>
      ${list.length ? `<div class="rtab">
        <div class="rrow rth"><span class="rn">Klant › project › taak</span><span class="rc bill">Declarabel</span><span class="rc dur">Duur</span><span class="rc share">Aandeel</span></div>
        ${rt}
        <div class="rrow rtotal"><span class="rn">Totaal</span><span class="rc bill">${fmtDur(billable)}</span><span class="rc dur">${fmtDur(total)}</span><span class="rc share"></span></div>
      </div>` : '<div style="color:var(--muted);text-align:center;padding:30px">Geen registraties in deze periode.</div>'}
    </div>`;

  const rerender = () => { const y = window.scrollY; renderReports().then(() => window.scrollTo(0, y)); };
  $('#rout').onclick = ev => {
    const x = ev.target.closest('[data-x]'), o = ev.target.closest('[data-o]');
    if (x) { const k = x.dataset.x; listClosed.has(k) ? listClosed.delete(k) : listClosed.add(k); rerender(); }
    else if (o) { const k = o.dataset.o; listOpen.has(k) ? listOpen.delete(k) : listOpen.add(k); rerender(); }
  };
  const allKeys = () => tree.flatMap(cg => cg.projects.flatMap(pg => pg.groups.map(g => 'r|' + g.key)));
  $('#rOpen').onclick = () => { [...listClosed].filter(k => k.startsWith('r|')).forEach(k => listClosed.delete(k)); allKeys().forEach(k => listOpen.add(k)); rerender(); };
  $('#rClose').onclick = () => { allKeys().forEach(k => listOpen.delete(k)); rerender(); };
}

function exportCsv(list, from, to) {
  const q = v => { const s = String(v ?? ''); return /[";\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const head = ['Datum', 'Begin', 'Eind', 'Duur (u:mm)', 'Duur (uren)', 'Klant', 'Project', 'Taak', 'Omschrijving', 'Tags', 'Declarabel'];
  const lines = list.map(e => {
    const s = new Date(e.start_time), en = new Date(e.end_time), p = projById(e.project_id), c = p && clientById(p.client_id), t = taskById(e.task_id);
    return [dayKey(s), fmtTime(s), fmtTime(en), fmtDur(en - s), ((en - s) / 36e5).toFixed(2).replace('.', ','), c?.name || '', p?.name || '', t?.name || '', e.description, (e.tags || []).join(', '), e.billable ? 'Ja' : 'Nee'].map(q).join(';');
  });
  const blob = new Blob(['﻿' + [head.join(';'), ...lines].join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = `tijdregistratie_${dayKey(from)}_${dayKey(addDays(to, -1))}.csv`; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* ---------- Synchroniseren tussen werkplekken ---------- */
// Bij terugkeren naar het tabblad halen we de nieuwste gegevens op,
// zodat een timer die op een andere computer is gestart/gestopt meteen klopt.
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState !== 'visible' || !user || !sb) return;
  if (document.activeElement && document.activeElement.matches('input, select') || $('.backdrop')) return;
  await loadAll();
  if (view === 'tracker') { renderTimer(); renderTree(); renderList(); }
});

init();
</script>
